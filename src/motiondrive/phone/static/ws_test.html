<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MotionDrive WebSocket Diagnostic Test</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #080b11;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      padding: 16px;
      line-height: 1.5;
    }
    .container {
      max-width: 540px;
      margin: 0 auto;
      background: #111722;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: 1.25rem;
      color: #38bdf8;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 10px;
    }
    .status-grid {
      display: grid;
      grid-template-columns: 140px 1fr;
      gap: 8px 12px;
      font-size: 0.95rem;
      margin-bottom: 20px;
    }
    .label {
      color: #94a3b8;
      font-weight: 600;
    }
    .value {
      color: #f1f5f9;
      font-family: monospace;
      word-break: break-all;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 0.85rem;
    }
    .badge-pass { background: #064e3b; color: #34d399; }
    .badge-connecting { background: #78350f; color: #fbbf24; }
    .badge-open { background: #064e3b; color: #34d399; }
    .badge-error { background: #7f1d1d; color: #f87171; }
    .badge-closed { background: #1e293b; color: #94a3b8; }
    .btn-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    button {
      flex: 1;
      padding: 12px 16px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: all 0.15s ease-in-out;
    }
    .btn-test {
      background: #0284c7;
      color: #ffffff;
    }
    .btn-test:hover { background: #0369a1; }
    .btn-test:active { transform: scale(0.98); }
    .btn-close {
      background: #334155;
      color: #e2e8f0;
    }
    .btn-close:hover { background: #475569; }
    .log-box {
      background: #06090e;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 12px;
      height: 200px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 0.8rem;
      color: #cbd5e1;
    }
    .log-entry { margin-bottom: 4px; border-bottom: 1px solid #0f172a; padding-bottom: 2px; }
    .log-time { color: #64748b; }
    .log-success { color: #34d399; }
    .log-err { color: #f87171; }
    .log-warn { color: #fbbf24; }
    .nav-link {
      display: block;
      margin-top: 16px;
      text-align: center;
      color: #38bdf8;
      text-decoration: none;
      font-size: 0.9rem;
    }
    .nav-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <h1>MOTIONDRIVE WEBSOCKET TEST</h1>

    <div class="status-grid">
      <div class="label">HTTP:</div>
      <div class="value"><span class="badge badge-pass">● PASS (port 8765)</span></div>

      <div class="label">Target:</div>
      <div class="value" id="ws-target-display">ws://...</div>

      <div class="label">TCP/WS Result:</div>
      <div class="value"><span id="ws-status-badge" class="badge badge-closed">IDLE</span></div>

      <div class="label">Close Code:</div>
      <div class="value" id="ws-close-code">none</div>

      <div class="label">Close Reason:</div>
      <div class="value" id="ws-close-reason">none</div>

      <div class="label">Browser Error:</div>
      <div class="value" id="ws-error-display">none</div>

      <div class="label">Server Echo ACK:</div>
      <div class="value" id="ws-ack-display">none</div>
    </div>

    <div class="btn-group">
      <button id="btn-run-test" class="btn-test" type="button">TEST WEBSOCKET</button>
      <button id="btn-close-test" class="btn-close" type="button">DISCONNECT</button>
    </div>

    <div class="label" style="margin-bottom: 6px;">Event Log:</div>
    <div id="event-log" class="log-box"></div>

    <a id="nav-controller-link" class="nav-link" href="/">← Return to Phone Controller</a>
  </div>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const wsHost = window.location.hostname || '127.0.0.1';
      const wsPortParam = parseInt(params.get('ws_port'), 10);
      const wsPort = (wsPortParam > 0) ? wsPortParam : 8766;
      const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${wsProtocol}//${wsHost}:${wsPort}`;

      const targetEl = document.getElementById('ws-target-display');
      const statusBadge = document.getElementById('ws-status-badge');
      const closeCodeEl = document.getElementById('ws-close-code');
      const closeReasonEl = document.getElementById('ws-close-reason');
      const errorEl = document.getElementById('ws-error-display');
      const ackEl = document.getElementById('ws-ack-display');
      const logBox = document.getElementById('event-log');
      const btnRun = document.getElementById('btn-run-test');
      const btnClose = document.getElementById('btn-close-test');
      const controllerLink = document.getElementById('nav-controller-link');

      targetEl.textContent = wsUrl;
      controllerLink.href = '/' + window.location.search;

      let testSocket = null;

      function logEvent(msg, type = 'info') {
        const time = new Date().toTimeString().split(' ')[0];
        const entry = document.createElement('div');
        entry.className = 'log-entry';
        let typeClass = '';
        if (type === 'success') typeClass = 'log-success';
        if (type === 'error') typeClass = 'log-err';
        if (type === 'warn') typeClass = 'log-warn';
        entry.innerHTML = `<span class="log-time">[${time}]</span> <span class="${typeClass}">${msg}</span>`;
        logBox.appendChild(entry);
        logBox.scrollTop = logBox.scrollHeight;
        console.log(`[WS-TEST] [${type.toUpperCase()}] ${msg}`);
      }

      function setStatus(state, badgeClass, text) {
        statusBadge.className = `badge ${badgeClass}`;
        statusBadge.textContent = text || state;
      }

      function runTest() {
        if (testSocket) {
          try { testSocket.close(); } catch (e) {}
          testSocket = null;
        }

        closeCodeEl.textContent = 'none';
        closeReasonEl.textContent = 'none';
        errorEl.textContent = 'none';
        ackEl.textContent = 'waiting...';

        setStatus('CONNECTING', 'badge-connecting', '○ CONNECTING');
        logEvent(`WS_CONNECT_START url=${wsUrl}`, 'warn');

        try {
          testSocket = new WebSocket(wsUrl);

          testSocket.onopen = function () {
            setStatus('OPEN', 'badge-open', '● OPEN');
            logEvent(`WS_OPEN (TCP connection established to ${wsUrl})`, 'success');
            
            // Send test ping to verify two-way framing without requiring game session tokens
            try {
              const testMsg = JSON.stringify({ type: 'ws_test', time: Date.now() });
              testSocket.send(testMsg);
              logEvent('WS_TEST_SEND sent test ping', 'info');
            } catch (e) {
              logEvent(`WS_TEST_SEND_ERROR ${e.message}`, 'error');
            }
          };

          testSocket.onmessage = function (e) {
            logEvent(`WS_MESSAGE_RECEIVED: ${e.data}`, 'success');
            try {
              const data = JSON.parse(e.data);
              if (data.type === 'ws_test_ack') {
                ackEl.textContent = 'RECEIVED ✓ (Server acknowledged test packet)';
                ackEl.style.color = '#34d399';
              }
            } catch (err) {}
          };

          testSocket.onerror = function (e) {
            const errStr = e.message || 'Browser network error / connection refused';
            setStatus('ERROR', 'badge-error', '✕ ERROR');
            errorEl.textContent = errStr;
            logEvent(`WS_ERROR error=${errStr}`, 'error');
          };

          testSocket.onclose = function (e) {
            closeCodeEl.textContent = e.code || 'none';
            closeReasonEl.textContent = e.reason || (e.wasClean ? 'Normal closure' : 'Abnormal closure (check firewall/timeout)');
            if (statusBadge.textContent.indexOf('OPEN') === -1) {
              setStatus('CLOSED', 'badge-error', '✕ CLOSED');
            } else {
              setStatus('CLOSED', 'badge-closed', 'CLOSED');
            }
            logEvent(`WS_CLOSE code=${e.code} reason=${e.reason || 'none'} was_clean=${e.wasClean}`, e.wasClean ? 'info' : 'warn');
          };

        } catch (err) {
          setStatus('ERROR', 'badge-error', '✕ FAILED');
          errorEl.textContent = err.message || String(err);
          logEvent(`WS_EXCEPTION error=${err.message}`, 'error');
        }
      }

      function closeTest() {
        if (testSocket) {
          logEvent('User requested disconnect', 'info');
          testSocket.close();
          testSocket = null;
        }
      }

      btnRun.addEventListener('click', runTest);
      btnClose.addEventListener('click', closeTest);

      // Auto-run test on load for instant feedback
      logEvent('Page loaded via HTTP 8765. Ready to test WebSocket 8766.', 'info');
      runTest();
    })();
  </script>
</body>
</html>
